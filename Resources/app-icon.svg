<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Claude Usage Bar</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F2E2B"/><stop offset="1" stop-color="#1C1B1A"/></linearGradient>
    <clipPath id="clawd"><rect x="20" y="0" width="80" height="10"/><rect x="20" y="10" width="10" height="10"/><rect x="40" y="10" width="40" height="10"/><rect x="90" y="10" width="10" height="10"/><rect x="0" y="20" width="120" height="20"/><rect x="20" y="40" width="80" height="20"/><rect x="20" y="60" width="10" height="20"/><rect x="40" y="60" width="10" height="20"/><rect x="70" y="60" width="10" height="20"/><rect x="90" y="60" width="10" height="20"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(152 272) scale(6)" shape-rendering="crispEdges">
    <!-- 채움 높이를 바꾸려면 아래 두 사각형의 경계값(30)만 수정 -->
    <g clip-path="url(#clawd)">
      <rect width="120" height="30" fill="#5C5954"/>
      <rect y="30" width="120" height="50" fill="#D97757"/>
    </g>
  </g>
</svg>
